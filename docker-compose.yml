services:
  retrieval:
    build: .
    gpus: all
    network_mode: none
    shm_size: 4gb
    volumes:
      - ./data:/data:ro
      - ./runs:/runs
      - ./weights:/app/weights:ro
    command:
      - checkpoint=${CHECKPOINT:?Set CHECKPOINT to a checkpoint path under /runs}
      - data.root=/data
      - eval.split=test
      - eval.output_dir=/runs/submission
