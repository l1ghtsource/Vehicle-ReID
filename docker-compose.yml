services:
  retrieval:
    build: .
    gpus: all
    network_mode: none
    shm_size: 4gb
    environment:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NO_ALBUMENTATIONS_UPDATE: "1"
    volumes:
      - ${DATA_ROOT:-./data}:/data:ro
      - ${OUTPUT_DIR:-./runs/submission}:/runs/submission
    command:
      - checkpoint=${CHECKPOINT:-/app/weights/finetuned/eva02.pt}
      - data.root=/data
      - eval.split=test
      - eval.output_dir=/runs/submission
      - eval.top_k=10
      - refusal=eva02_ensemble
