# @package _global_
# Finished run on the K=2 trial23 recipe. Last four EVA02 blocks, LayerNorm each, then mean the token maps
# so the neck stays 1024→256 like single-level trial23.
defaults:
  - current_best_tuned
  - _self_
name: eva02_multilevel_late
data:
  sampler:
    instances: 2
    camera_diverse: false
model:
  features_only: true
  out_indices: [20, 21, 22, 23]
  multilevel_fuse: mean
