# @package _global_
name: smoke
model:
  name: resnet18
  pretrained: false
  drop_path_rate: 0.0
data:
  image_size: [64, 64]
  num_workers: 0
  batch_size_eval: 64
  sampler:
    identities: 4
    instances: 2
    steps_per_epoch: 2
train:
  epochs: 1
trainer:
  limit_val_batches: 2
  log_every_n_steps: 1
