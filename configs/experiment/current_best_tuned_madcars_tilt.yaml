# @package _global_
# current_best_tuned recipe (provenance: current_best_tuned.yaml) with the reid_tilt
# augmentation group applied AFTER this file's content, so tilt transforms replace
# the tuned inline ones. Do NOT try `augmentation=reid_tilt` on the CLI with
# experiment=current_best_tuned: the experiment's inline augmentation block is
# composed after the group choice and silently clobbers it.
defaults:
  - override /model: llm2clip
  - override /loss: arcface_adasp
  - override /optimizer: adamw
  - override /augmentation: reid_tilt
name: current_best_tuned_madcars_tilt
data:
  context_pct: 6.201741080661072
  context_jitter_pct: 8.594371961218801
  resize_mode: stretch
  image_size:
  - 336
  - 336
  sampler:
    kind: pk
    identities: 16
    instances: 2
    camera_diverse: false
train:
  epochs: 27
  accumulate_grad_batches: 4
  gradient_clip_val: 4.373365182485516
  freeze_backbone_epochs: 0
  backbone_lr_multiplier: 0.05017559967954163
  layer_decay: 0.8934696293536177
  no_weight_decay_bias_norm: true
  rdrop:
    enabled: false
    weight: 0.39436527364130586
    temperature: 1.2986365329947283
  awp:
    enabled: false
    start_epoch: 5
    lr: 0.08597429671280962
    eps: 0.0008426688228023555
    weight: 0.2495768833990789
    parameter_pattern: weight
  ema:
    enabled: true
    decay: 0.9406090932120481
    validate: true
model:
  drop_path_rate: 0.08475853663214046
  pooling:
    kind: attn
    p: 5.287033376337234
    trainable: true
    attention_hidden: 128
  head:
    embedding_dim: 256
    bnneck: true
    dropout: 0.22222483845111796
    retrieval_feature: neck
    local_parts: 0
loss:
  terms:
  - name: arcface
    weight: 0.37821025890229204
    feature: neck
    params:
      margin: 0.4789452160852028
      scale: 35.05004134475763
  - name: adasp
    weight: 2.8262507466706026
    feature: neck
    params:
      temp: 0.026071235242105424
      loss_type: adasp
optimizer:
  lr: 0.0006983608478082421
  weight_decay: 0.0006624568785150743
  betas:
  - 0.9497925039154058
  - 0.9983205225232131
  eps: 3.424080697950365e-08
scheduler:
  kind: linear
  warmup_epochs: 2
  warmup_start_factor: 0.0003731205562294547
  min_lr_ratio: 0.1085248671301968
  milestones:
  - 27
  - 28
  gamma: 0.5963261708933612
eval:
  weights: ema
  tta:
    enabled: false
    hflip: true
    scales:
    - 1.0
    rotations:
    - -4
    - 0
    - 4
    context_pcts:
    - 0.0
    - 4.972099731465896
postproc:
  # Contest serving is streaming: gallery may be prebuilt, each query is independent.
  # AQE and query-query rerank stay off; they were measured on OOF only.
  enabled: false
  streaming: true
  aqe:
    enabled: false
    k: 17
    alpha: 3.2901389874171656
    iterations: 1
    gallery_only: true
  gallery_aggregation:
    enabled: false
    k: 1
    alpha: 0.9650954315703635
    min_similarity: 0.7419178426762826
  rerank:
    kind: gnn
    k1: 22
    k2: 11
    lambda_value: 0.23238988084901938
