# labeled train only: PK 16×4, camera-diverse PK sampling, 35-epoch budget.
# Identity-disjoint 5-fold OOF (runs/cv/eva02_k4_cam_ep35): mAP 0.862, mAP@10 0.851, Rank-1 0.848.
