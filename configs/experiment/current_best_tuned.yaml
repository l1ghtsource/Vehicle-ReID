# Without camera_diverse (runs/cv/eva02_k4): 0.855 / 0.844 / 0.849. K=6 + cam and SOTA augs
# at 35 epochs did not beat this. HDBSCAN test pseudo-labels are not used.
# Junk = same vehicle and camera.
# Image size 336 and local_parts=0 are required for this backbone; other knobs stay overridable.
