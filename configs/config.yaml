defaults:
  - model: convnext_tiny
  - loss: combined
  - optimizer: adamw
  - scheduler: cosine
  - augmentation: reid
  - refusal: none
  - _self_
  - experiment: null
seed: 42
name: baseline
output_dir: runs/${name}/fold${data.fold}/${now:%Y%m%d_%H%M%S}
checkpoint: null
resume: null
# Loads model.* weights from a pretrain.py checkpoint. Mutually exclusive with resume.
init_checkpoint: null
data:
  root: data
  train_csv: ${data.root}/train.csv
  # Identities in this file may be held out. Other train rows stay in train (fold=-1).
  val_source_csv: ${data.root}/train.csv
  query_csv: ${data.root}/test_query.csv
  gallery_csv: ${data.root}/test_gallery.csv
  image_dir: ${data.root}/images
  folds_file: artifacts/folds.csv
  n_folds: 5
  fold: 0
  # Train on every competition identity. Epochs come from data.cv_dir (mean CV stop) or train.epochs.
  full_retrain: false
  cv_dir: null
  group_column: vehicle_id
  context_pct: 10.0
  context_jitter_pct: 0.0
  image_size: [256, 256]
  resize_mode: pad
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  # pil is serving. jpeg is CPU torchvision. jpeg_cuda is rejected in DataLoader workers.
  decode_backend: pil
  batch_size_eval: 64
  verify_files: true
  sampler:
    kind: pk
    identities: 16
    instances: 4
    steps_per_epoch: null
    camera_diverse: true
  validation:
    query_per_identity: 1
    cross_camera: true
    # Junk is same vehicle_id and same camera_id. Other identities on the query camera stay.
    exclude_all_same_camera: false
    ranks: [1, 5, 10]
train:
  epochs: 40
  accumulate_grad_batches: 1
  gradient_clip_val: 5.0
  freeze_backbone_epochs: 0
  backbone_lr_multiplier: 0.1
  layer_decay: 1.0
  no_weight_decay_bias_norm: true
  rdrop:
    enabled: false
    weight: 0.5
    temperature: 1.0
  awp:
    enabled: false
    start_epoch: 3
    lr: 0.01
    eps: 0.001
    weight: 0.5
    parameter_pattern: weight
  ema:
    enabled: false
    decay: 0.999
    validate: true
trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  precision: bf16-mixed
  deterministic: true
  benchmark: false
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  max_steps: -1
  enable_progress_bar: true
  sync_batchnorm: false
checkpointing:
  monitor: val/mAP
  mode: max
  save_top_k: 2
  save_last: false
  last_every_n_epochs: 5
  keep_epochs: []
eval:
  split: val
  weights: auto
  device: cuda
  precision: bf16
  output_dir: ${output_dir}/evaluation
  top_k: 10
  save_distances: true
  inference_backend: torch
  tensorrt:
    onnx_path: ${output_dir}/tensorrt/model.onnx
    engine_path: ${output_dir}/tensorrt/model.engine
    precision: fp16
    min_batch: 1
    opt_batch: 16
    max_batch: 32
    workspace_gb: 4
  # Reproducible inference by default. Opt in to TF32 and cuDNN benchmark for speed experiments.
  fast_kernels: false
  cpu_threads: 0
  tta:
    enabled: false
    hflip: true
    scales: [1.0]
    rotations: [0]
    context_pcts: null
postproc:
  enabled: false
  # One query vs the static gallery. AQE and query-query graphs are rejected when true.
  streaming: true
  max_dense_gb: 4.0
  aqe:
    enabled: false
    k: 5
    alpha: 3.0
    iterations: 1
    gallery_only: true
  gallery_aggregation:
    enabled: false
    k: 3
    alpha: 0.7
    min_similarity: 0.9
  rerank:
    kind: none
    k1: 20
    k2: 6
    lambda_value: 0.3
    device: cpu
hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}/hydra
  sweep:
    dir: runs/sweeps/${now:%Y%m%d_%H%M%S}
    subdir: ${hydra.job.num}
