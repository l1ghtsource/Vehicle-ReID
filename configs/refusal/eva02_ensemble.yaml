# EVA02 labeled-only trial23 nested 5-fold inner-CV: accept if both frozen heads agree.
# OOF calibration only; Docker serving uses eva02_threshold (cosine).
# Thresholds maximize 0.7 F1 + 0.3 TNR on 20% identity-hold-out eval packs (not 50/50 train pairs).
# Contest F1/TNR are micro over the query set; organizers do not re-threshold confidence.
# A missing query_id in candidates.csv is the refusal.
kind: ensemble
cosine_threshold: 0.6638
model_path: weights/finetuned/eva02_catboost.cbm
model_threshold: 0.5540
rank_threshold: null
k: 10
with_embeddings: true
