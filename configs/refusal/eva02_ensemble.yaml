# EVA02 nested 5-fold inner-CV: accept if both frozen heads agree.
# Rank-average over the query batch is not streaming-safe.
# Contest F1/TNR are micro over the query set; organizers do not re-threshold confidence.
# A missing query_id in candidates.csv is the refusal.
kind: ensemble
cosine_threshold: 0.6532
model_path: weights/finetuned/eva02_catboost.cbm
model_threshold: 0.4329
rank_threshold: null
k: 10
with_embeddings: true
