[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-reid-lab"
version = "0.1.0"
description = "Identity-disjoint vehicle retrieval experiments with Lightning and Hydra"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "lightning==2.5.5",
    "hydra-core==1.3.2",
    "timm==1.0.20",
    "transformers==4.56.2",
    "albumentations==2.0.8",
    "pandas==2.3.2",
    "scikit-learn==1.7.2",
    "catboost>=1.2,<2",
    "opencv-python-headless>=4.10,<5",
    "pytorch-metric-learning==2.9.0",
    "numpy>=1.26,<3",
    "scipy>=1.14",
    "pillow>=11",
    "einops>=0.8",
    "huggingface-hub>=0.34,<1",
    "open_clip_torch==3.1.0",
    "ftfy",
    "regex",
    "safetensors",
    "tqdm",
    "optuna>=4.5,<5",
    "optuna-dashboard>=0.17,<1",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==7.1.0", "ruff==0.15.7", "ty==0.0.81"]
[tool.setuptools.packages.find]
include = [
    "models*",
    "modules*",
    "dataset*",
    "augmentations*",
    "postproc*",
    "posthoc*",
    "interp*",
    "refusal*",
    "third_party*",
    "scripts*",
    "hpo*",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--cov", "--cov-report=term-missing", "--cov-fail-under=100"]
[tool.setuptools]
py-modules = ["train", "pretrain", "eval"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "PLC0415"]

[tool.ty.src]
exclude = ["third_party"]

[tool.coverage.run]
source = [
    "models",
    "modules",
    "dataset",
    "augmentations",
    "postproc",
    "posthoc",
    "interp",
    "refusal",
    "scripts",
    "hpo",
    "train",
    "pretrain",
    "eval",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
precision = 2

