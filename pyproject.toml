[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-reid-lab"
version = "0.1.0"
description = "Identity-disjoint vehicle retrieval experiments with Lightning and Hydra"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "lightning==2.5.5",
    "hydra-core==1.3.2",
    "timm==1.0.20",
    "transformers==4.56.2",
    "albumentations==2.0.8",
    "pandas==2.3.2",
    "scikit-learn==1.7.2",
    "catboost==1.2.10",
    "opencv-python-headless==4.14.0.94",
    "pytorch-metric-learning==2.9.0",
    "numpy==2.4.6; python_full_version < '3.12'",
    "numpy==2.5.3; python_full_version >= '3.12'",
    "scipy==1.17.1; python_full_version < '3.12'",
    "scipy==1.18.1; python_full_version >= '3.12'",
    "pillow==12.3.0",
    "einops==0.8.2",
    "huggingface-hub==0.36.2",
    "open_clip_torch==3.1.0",
    "ftfy==6.3.1",
    "regex==2026.9.10",
    "safetensors==0.8.0",
    "tqdm==4.70.1",
    "optuna==4.9.0",
    "optuna-dashboard==0.21.0",
]
[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.1.0",
    "ruff==0.15.7",
    "ty==0.0.81",
    "matplotlib==3.11.2",
    "ipython==9.5.0",
]
[tool.setuptools.packages.find]
include = [
    "models*",
    "modules*",
    "dataset*",
    "augmentations*",
    "postproc*",
    "posthoc*",
    "interp*",
    "refusal*",
    "profiling*",
    "third_party*",
    "scripts*",
    "hpo*",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--cov", "--cov-report=term-missing", "--cov-fail-under=100"]
[tool.setuptools]
py-modules = ["train", "pretrain", "eval"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "PLC0415"]

[tool.ty.src]
exclude = ["third_party"]

[tool.coverage.run]
source = [
    "models",
    "modules",
    "dataset",
    "augmentations",
    "postproc",
    "posthoc",
    "interp",
    "refusal",
    "profiling",
    "scripts",
    "hpo",
    "train",
    "pretrain",
    "eval",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
precision = 2

